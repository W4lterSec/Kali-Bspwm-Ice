[colors]
bg = #ff071119
fg = #e7f4fa
pink = #25d9f8
purple = #126a85
cyan = #73e5ff
muted = #607d8d

[bar/dragon]
width = 100%:-@BARMARGIN2@
height = @BARHEIGHT@
offset-x = @BARMARGIN@
offset-y = @BARTOP@
radius = @BARRADIUS@
dpi = 96
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = DejaVu Sans Mono:size=@TEXTFONT@;@FONTBASE@
font-1 = Hack Nerd Font Propo:size=@DRAGONFONT@;@ICONBASE@
font-2 = Hack Nerd Font:size=@STATUSFONT@;@FONTBASE@
padding-left = 1
padding-right = 1
module-margin = 1
border-size = @BARBORDER@
border-color = #244859
wm-restack = bspwm
enable-ipc = true
modules-left = brand bspwm
modules-center = network
modules-right = status pulseaudio link date

[module/brand]
type = custom/text
content = kali
content-foreground = ${colors.cyan}

[module/bspwm]
type = internal/bspwm
format = <label-state>
pin-workspaces = true
fuzzy-match = false
label-focused = %{T2}%icon%%{T-}
label-focused-background = ${colors.purple}
label-focused-foreground = #ffffff
label-focused-padding = @WSPADDING@
label-occupied = %{T2}%icon%%{T-}
label-occupied-foreground = #a8d8ec
label-occupied-padding = @WSPADDING@
label-empty = %{T2}%icon%%{T-}
label-empty-foreground = ${colors.muted}
label-empty-padding = @WSPADDING@
label-urgent = %{T2}%icon%%{T-}
label-urgent-foreground = ${colors.pink}
label-urgent-padding = @WSPADDING@
@WORKSPACEICONS@

[module/network]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/network.py"
interval = 3
label = %output%
label-foreground = ${colors.cyan}

[module/status]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/metrics.py" --stream @COMPACT@
tail = true
label = %output%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = "@VOLUMEICON@ "
format-volume-prefix-foreground = ${colors.pink}
label-volume = %percentage%%
label-muted = @MUTEICON@
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/link]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/metrics.py" --link
interval = 5
label = %output%
label-foreground = ${colors.cyan}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d/%m/%Y %H:%M
label = %date%

[settings]
screenchange-reload = true
