backend = "xrender";
use-damage = false;
vsync = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.0;
# Uniform whole-window opacity. Kitty never requests a transparent framebuffer.
opacity-rule = [ "@WINDOWOPACITY@:class_g = 'kitty'" ];
shadow = @SHADOW@;
shadow-radius = @SHADOWRADIUS@;
shadow-opacity = 0.35;
shadow-offset-x = -@SHADOWOFFSET@;
shadow-offset-y = -@SHADOWOFFSET@;
shadow-color = "#07354a";
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "fullscreen" ];
corner-radius = @CORNERRADIUS@;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "fullscreen" ];
fading = false;
unredir-if-possible = false;
detect-client-opacity = true;
