[colors]
bg = #ff071119
fg = #e7f4fa
pink = #25d9f8
purple = #126a85
cyan = #73e5ff
muted = #607d8d

[bar/dragon]
width = 100%:-32
height = 48
offset-x = 16
offset-y = 12
radius = 20
dpi = 96
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = DejaVu Sans Mono:size=13;3
font-1 = Hack Nerd Font Propo:size=18;3
font-2 = Hack Nerd Font:size=11;3
padding-left = 1
padding-right = 1
module-margin = 1
border-size = 0
border-color = #244859
wm-restack = bspwm
enable-ipc = true
modules-left = brand bspwm
modules-center = network
modules-right = status pulseaudio link date

[module/brand]
type = custom/text
content = kali
content-foreground = ${colors.cyan}

[module/bspwm]
type = internal/bspwm
format = <label-state>
pin-workspaces = true
fuzzy-match = false
label-focused = %{T2}%icon%%{T-}
label-focused-background = ${colors.purple}
label-focused-foreground = #ffffff
label-focused-padding = 1
label-occupied = %{T2}%icon%%{T-}
label-occupied-foreground = #a8d8ec
label-occupied-padding = 1
label-empty = %{T2}%icon%%{T-}
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %{T2}%icon%%{T-}
label-urgent-foreground = ${colors.pink}
label-urgent-padding = 1
ws-icon-0 = I;
ws-icon-1 = II;
ws-icon-2 = III;
ws-icon-3 = IV;
ws-icon-4 = V;
ws-icon-5 = VI;
ws-icon-6 = VII;
ws-icon-7 = VIII;
ws-icon-default = 

[module/network]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/network.py"
interval = 3
label = %output%
label-foreground = ${colors.cyan}

[module/status]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/metrics.py" --stream 
tail = true
label = %output%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume>
format-volume-prefix = "%{T3}%{T-} "
format-volume-prefix-foreground = ${colors.pink}
label-volume = %percentage%%
label-muted = %{T3}%{T-}
label-muted-foreground = ${colors.muted}
click-right = pavucontrol

[module/link]
type = custom/script
exec = python3 "$DRAGON_ROOT/scripts/metrics.py" --link
interval = 5
label = %output%
label-foreground = ${colors.cyan}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %d/%m/%Y %H:%M
label = %date%

[settings]
screenchange-reload = true
