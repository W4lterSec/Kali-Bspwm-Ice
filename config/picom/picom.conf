backend = "xrender";
use-damage = false;
vsync = false;
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-dim = 0.0;
# Uniform whole-window opacity. Kitty never requests a transparent framebuffer.
opacity-rule = [ "90:class_g = 'kitty'" ];
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.35;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#07354a";
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "fullscreen" ];
corner-radius = 20;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "fullscreen" ];
fading = false;
unredir-if-possible = false;
detect-client-opacity = true;
